<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PersonalOS</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f5f6f8;color:#172433}section,article{background:white;padding:20px;border-radius:15px;margin:15px 0}input,textarea,button{font:inherit;padding:10px;margin:5px 0;box-sizing:border-box}input,textarea{width:100%}button{cursor:pointer;border:1px solid #aab6c4;border-radius:8px;background:#f0f5ff;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small{color:#536275}</style>
<h1>PersonalOS</h1><p>任务交给这台 Mac，本地模型执行规划。</p>
<section><h2>设备配对</h2><input id="code" type="password" placeholder="在 Mac 运行配对程序，输入 5 分钟有效的配对码"><button id="pair">配对</button><small>令牌只保留在当前页面内存，刷新页面需重新配对。</small></section>
<section><h2>提交任务</h2><textarea id="text">今天应该先做什么</textarea><input id="root" placeholder="文件任务：已在 Mac 授权的精确目录"><input id="query" value="PROJECT" aria-label="检索关键词"><input id="due" type="datetime-local" aria-label="提醒时间"><button id="send">提交</button><button id="refresh">刷新历史</button><button id="audit">查看审计</button><p><small>提醒不填时间则默认明天 09:00。文件整理先预览后确认。提醒通知取决于手机权限和推送配置；PROJECT 需先完成只读授权。手机 App 打开时自动更新，本页点刷新。</small></p></section>
<p id="message" role="status"></p><div id="tasks"></div><pre id="log"></pre>
<script>
let token=''; const $=id=>document.getElementById(id);
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error);return data}
async function action(fn){try{await fn()}catch(e){$('message').textContent=e.message}}
$('pair').onclick=()=>action(async()=>{token=(await api('/pair',{code:$('code').value,name:'Mac browser'})).token;$('code').value='';$('message').textContent='已配对';await refresh()});
$('send').onclick=()=>action(async()=>{let b={text:$('text').value,root:$('root').value,query:$('query').value};if($('due').value)b.due=new Date($('due').value).toISOString();await api('/tasks',b);$('message').textContent='已提交，请刷新查看结果';await refresh()});
$('refresh').onclick=()=>action(refresh);$('audit').onclick=()=>action(async()=>{$('log').textContent=JSON.stringify(await api('/audit'),null,2)});
async function refresh(){const tasks=await api('/tasks');$('tasks').replaceChildren();for(const t of tasks){const item=document.createElement('article');let body=JSON.parse(t.body);for(const [tag,txt] of [['h3',body.text],['small',t.state],['pre',t.result]]){const el=document.createElement(tag);el.textContent=txt;item.append(el)}if(t.state==='awaiting_confirmation'){const pre=document.createElement('pre');pre.textContent=JSON.stringify(JSON.parse(t.plan),null,2);item.append(pre);button('确认以上移动','approve',true)}if(t.state==='completed'&&JSON.parse(t.plan).moves)button('撤销整理','undo',true);if(t.state==='scheduled')button('取消提醒','cancel',false);$('tasks').append(item);function button(label,op,ask){let b=document.createElement('button');b.textContent=label;b.onclick=()=>action(async()=>{if(ask&&!confirm(label+'？请确认已检查路径。'))return;await api('/tasks/'+t.id+'/'+op,{});await refresh()});item.append(b)}}}
</script></html>
